name: Android CI/CD & Automated Verification

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build, Test & Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        id: unit_tests
        run: |
          echo "Running Android Unit Tests..."
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        id: build_debug
        run: |
          echo "Compiling Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        id: build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Compiling Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build with keystore skipped, debug artifact ready"

      - name: Publish Test Report & CI Summary Bot
        if: always()
        run: |
          echo "### 🤖 yNotes CI/CD & Bot Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit Tests** | ${{ steps.unit_tests.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug Build** | ${{ steps.build_debug.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Build** | ${{ steps.build_release.outcome == 'success' && '✅ PASSED' || '⚠️ SKIPPED / FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yNotes-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yNotes-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          body: |
            ## 📱 yNotes Release ${{ github.ref_name }}
            - Modernización completa de UI/UX con Material Design 3 y transiciones fluidas.
            - Bloc de notas cifrado de alta seguridad (AES-256-GCM / LINX CRYPT) con ejecución asíncrona optimizada.
            - Motor de esteganografía LSB en imágenes rápido y sin bloqueos de UI.
            - Widgets de Zona Segura con autenticación biométrica y auto-bloqueo.
            - Suite de pruebas unitarias automatizadas y verificación CI/CD.
          draft: false
          prerelease: false
