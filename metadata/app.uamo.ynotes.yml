AutoName: yNotes
Summary: Secure encrypted notes app with image steganography and biometric widgets
Description: |-
  yNotes is a privacy-first, ultra-secure note taking application designed for complete data security.

  Features:
  * Military-grade encryption (AES-256-GCM and LINX CRYPT)
  * Image Steganography (hide secret encrypted text inside normal images)
  * Biometric Home Screen Widgets with 10s auto-lock and screen-off revocation
  * Safe Zone App Launcher (Reverse mode & shortcut manager)
  * Expiration timers for self-destructing notes
  * 100% Free & Open Source, zero tracking, zero ads

